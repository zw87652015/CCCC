name: macOS Intel build

on:
  push:
    paths: ['mac/**', '.github/workflows/macos-intel.yml']
  pull_request:
    paths: ['mac/**', '.github/workflows/macos-intel.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build CCCC.app (x86_64, ad-hoc signed)
        env:
          CCCC_ARCHS: x86_64
          CCCC_SIGN_ID: '-'
        run: mac/build.sh

      - name: Check architecture
        run: lipo -info mac/build/CCCC.app/Contents/MacOS/CCCC

      - name: Zip
        run: ditto -c -k --keepParent mac/build/CCCC.app CCCC-macOS-x86_64-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CCCC-macOS-x86_64-unsigned
          path: CCCC-macOS-x86_64-unsigned.zip
